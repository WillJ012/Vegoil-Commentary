name: 每日植物油简报

on:
  schedule:
    # cron 用 UTC。北京/新加坡 08:45 = UTC 00:45（早8小时）。每天触发；
    # 没有 newsletter 的日子脚本会自动空跑退出，无副作用。
    - cron: '45 0 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动点「Run workflow」测试

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成并发送简报
        env:
          IMAP_HOST:         ${{ secrets.IMAP_HOST }}
          IMAP_PORT:         ${{ secrets.IMAP_PORT }}
          IMAP_USER:         ${{ secrets.IMAP_USER }}
          IMAP_PASS:         ${{ secrets.IMAP_PASS }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_SSL:          ${{ secrets.SMTP_SSL }}
          MAIL_TO:           ${{ secrets.MAIL_TO }}
          MINIMAX_API_KEY:   ${{ secrets.MINIMAX_API_KEY }}
          # 可选覆盖项（不填用默认）：
          MINIMAX_BASE_URL:  ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_MODEL:     ${{ secrets.MINIMAX_MODEL }}
          SENDER_CONTAINS:   ${{ secrets.SENDER_CONTAINS }}
          SUBJECT_CONTAINS:  ${{ secrets.SUBJECT_CONTAINS }}
        run: python vegoil_brief.py
